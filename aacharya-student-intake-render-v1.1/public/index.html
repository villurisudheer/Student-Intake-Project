<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aacharya Learning Academy - Student Information</title><style>
:root{--bg:#070b13;--card:#111a2c;--text:#f6f7fb;--muted:#9ca8bc;--line:#293752;--accent:#6f8cff;--ok:#60d4a6;--bad:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#070b13,#101b31);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 14px 40px}.hero{text-align:center;margin:10px 0 20px}.hero h1{font-size:24px;margin:0 0 6px}.hero p{color:var(--muted);margin:0}.card{background:rgba(17,26,44,.96);border:1px solid var(--line);border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label span,.label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;min-height:45px;padding:11px 12px;background:#0b1322;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit}textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}.subjects{display:flex;gap:8px;flex-wrap:wrap}.subjects label{display:flex;gap:6px;align-items:center;background:#0b1322;border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:13px}.subjects input{width:auto;min-height:0}.btn{width:100%;margin-top:16px;min-height:48px;border:1px solid #7189df;border-radius:11px;background:#263b7a;color:white;font-weight:750;font-size:16px}.note{color:var(--muted);font-size:12px;line-height:1.5}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px}.ok{display:block;background:#102a21;color:var(--ok);border:1px solid #285b4d}.bad{display:block;background:#2c1517;color:var(--bad);border:1px solid #67363b}.hp{position:absolute;left:-9999px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}.hero h1{font-size:20px}}</style></head><body><main class="wrap"><div class="hero"><h1>AACHARYA LEARNING ACADEMY</h1><p>Student Information Form</p></div><div class="card"><p class="note">Please provide only the information needed for classes and parent communication. Do not enter passwords, banking details, government ID numbers, or other unnecessary sensitive information.</p><form id="f"><div class="grid"><label><span>Student Full Name *</span><input name="studentName" required maxlength="100"></label><label><span>Class / Grade *</span><input name="grade" required maxlength="80" placeholder="Example: Class 12"></label><label><span>School / College</span><input name="school" maxlength="120"></label><label><span>Board</span><select name="board"><option value="">Select</option><option>CBSE</option><option>ICSE</option><option>State Board</option><option>IB</option><option>Cambridge</option><option>Other</option></select></label><label><span>Student Phone</span><input name="studentPhone" inputmode="tel" maxlength="24"></label><label><span>Student Email</span><input name="studentEmail" type="email" maxlength="120"></label><label><span>Parent / Guardian Name *</span><input name="parentName" required maxlength="100"></label><label><span>Parent / Guardian Phone *</span><input name="parentPhone" required inputmode="tel" maxlength="24"></label><label class="full"><span>Parent / Guardian Email</span><input name="parentEmail" type="email" maxlength="120"></label><div class="full"><span class="label">Subjects Required *</span><div class="subjects"><label><input type="checkbox" name="subjects" value="Chemistry">Chemistry</label><label><input type="checkbox" name="subjects" value="Physics">Physics</label><label><input type="checkbox" name="subjects" value="Mathematics">Mathematics</label><label><input type="checkbox" name="subjects" value="Biology">Biology</label><label><input type="checkbox" name="subjects" value="English">English</label></div></div><label><span>Preferred Class Mode</span><select name="preferredMode"><option>Online</option><option>Offline</option><option>Either</option></select></label><label><span>Address (optional)</span><input name="address" maxlength="400"></label><label class="full"><span>Notes / Learning Requirements</span><textarea name="notes" maxlength="800" placeholder="Optional"></textarea></label><label class="hp" aria-hidden="true"><span>Website</span><input name="website" tabindex="-1" autocomplete="off"></label></div><button class="btn" id="submit" type="submit">Submit Information</button><div id="msg" class="msg" role="status"></div></form></div></main><script>
const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';const fd=new FormData(f),subjects=fd.getAll('subjects');if(!subjects.length){msg.textContent='Please select at least one subject.';msg.className='msg bad';return}const data=Object.fromEntries(fd.entries());data.subjects=subjects;btn.disabled=true;btn.textContent='Submitting...';try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),txt=await r.text();let j;try{j=JSON.parse(txt)}catch{throw new Error('The server endpoint is not available. Please contact the academy.')}if(!r.ok)throw new Error(j.message||'Submission failed.');msg.textContent='Thank you. Your information was submitted successfully.';msg.className='msg ok';f.reset()}catch(err){msg.textContent=err.message||'Could not submit. Please try again.';msg.className='msg bad'}finally{btn.disabled=false;btn.textContent='Submit Information'}});
</script></body></html>
