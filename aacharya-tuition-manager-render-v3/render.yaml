services:
  - type: web
    name: aacharya-tuition-manager
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_NAME
        value: Aacharya Sudheer
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SYNC_KEY
        sync: false
    disk:
      name: aacharya-data
      mountPath: /var/data
      sizeGB: 1
